<!-- Supabase Auth → Emails → "Reset password". Assunto: Redefinir sua senha do Gradatim -->
<div style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:32px">
    <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#0f766e">Gradatim</p>
    <h1 style="margin:0 0 12px;font-size:18px">Redefinir sua senha</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5">
      Recebemos um pedido para trocar a senha da sua conta. Clique no botão
      abaixo para escolher uma nova senha. O link vale por 1 hora e só pode
      ser usado uma vez.
    </p>
    <p style="margin:0 0 24px">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
         style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:8px">
        Escolher nova senha
      </a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#475569">
      Se você não pediu a troca, ignore este e-mail: sua senha continua a mesma.
    </p>
  </div>
</div>
