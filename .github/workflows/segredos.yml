# Procura chaves e senhas no código a cada push e pull request (o repositório
# é público: segredo que entra no histórico precisa ser trocado).
# Usa a imagem Docker do gitleaks: a action oficial exige licença em repositório
# de organização. Regras em .gitleaks.toml.
name: Segredos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (histórico inteiro)
        # safe.directory: o dono dos arquivos no runner é outro usuário que o
        # do contêiner; sem isso o git recusa ler e a varredura fica parcial.
        run: >
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
          -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
